// tinkerglass control protocol: the two control interfaces of the tinkerglass USB mode
// ("tinkerglass control 0", ff/54/01, by convention the web app or `tg`; "tinkerglass control 1",
// ff/54/02, by convention a PC app such as eyepiece-pc). Both interfaces are identical: the same
// server (core.link, device/core/link) answers the same messages on each, and any client may use
// either. docs/architecture.md, "Control link", has the design.
//
// Framing: one message per USB bulk transfer, in both directions:
//
//   u8 'T' (0x54) | u8 frame version (1) | u16le flags | u32le length | `length` bytes of protobuf
//
// Host to goggles: ClientMessage. Goggles to host: ServerMessage. A transfer whose size is a
// multiple of the endpoint's packet size ends with a zero-length packet; receivers also use the
// length to join a transfer that arrived in pieces. Flags are 0; a receiver drops a frame with a
// flag it does not know, or another frame version. Payloads are at most 16 KiB.
//
// Compatibility: field numbers are permanent, unknown fields are skipped, and new requests and
// replies are new oneof members (a server answers a request it does not know with
// CODE_UNKNOWN_REQUEST). `protocol` changes only for an incompatible change of meaning.
// Copies of this file live in other programs (eyepiece-pc's contract/); change it here first.
syntax = "proto3";

package tinkerglass.control.v1;

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_V1 = 1;                  // this file
}

message ClientMessage {
  oneof body {
    Hello hello = 1;
    Request request = 2;
    Subscribe subscribe = 3;
  }
  reserved 4 to 15;
}

message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Response response = 2;
    Event event = 3;
  }
  reserved 4 to 15;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_WEB_APP = 1;
  ROLE_PC_APP = 2;
  ROLE_CLI = 3;
}

// The client's first message on an interface. The server answers with Welcome; a client skips
// anything before it (a reply to an earlier client may still be queued on the IN endpoint).
message Hello {
  Role role = 1;
  uint32 protocol = 2;              // the client's Protocol
  string client = 3;                // name and version, for the goggles' log ("eyepiece-pc 0.6.0")
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_LAUNCH = 1;            // Request.launch
  CAPABILITY_STATUS = 2;            // Request.status
  CAPABILITY_CONFIG = 3;            // Request.get_config, Request.set_config
  CAPABILITY_FILES = 4;             // Request.read_file, Request.write_file, Request.disk_usage
  CAPABILITY_EVENTS = 5;            // Subscribe and Event
  CAPABILITY_RELOAD = 6;            // Request.reload
  CAPABILITY_SCHEMA = 7;            // Request.get_schema
}

message Welcome {
  uint32 protocol = 1;              // the server's Protocol
  string version = 2;               // the running tinkerglass build
  uint32 interface = 3;             // which control interface this is: 0 or 1
  repeated Capability capabilities = 4;
}

message Request {
  uint32 id = 1;                    // echoed in the Response; chosen by the client
  oneof body {
    Launch launch = 2;
    GetStatus status = 3;
    GetConfig get_config = 4;
    SetConfig set_config = 5;
    ReadFile read_file = 6;
    WriteFile write_file = 7;
    GetDiskUsage disk_usage = 8;
    Reload reload = 9;
    GetSchema get_schema = 10;
  }
  reserved 11 to 31;
}

enum Code {
  CODE_OK = 0;
  CODE_UNKNOWN_REQUEST = 1;         // this server does not know the request
  CODE_INVALID = 2;                 // malformed (bad argument, missing field)
  CODE_NOT_INSTALLED = 3;           // no such app entry in the installed version
  CODE_NO_UI = 4;                   // the goggles' menu did not take the request (UI not running)
  CODE_ALREADY_RUNNING = 5;         // Launch without `replace` while the app runs; body says which
  CODE_FAILED = 6;                  // the app did not start, or exited during its start
  CODE_TIMEOUT = 7;                 // the app started but did not report ready in time
  CODE_DENIED = 8;                  // not allowed here (a write below /system or /vendor)
  CODE_NOT_FOUND = 9;               // no such file, or no such mod or setting
  CODE_IO = 10;                     // the goggles could not read or write (message says why)
}

message Response {
  uint32 id = 1;
  Code code = 2;
  string message = 3;               // a sentence for people when code is not CODE_OK
  oneof body {
    Launched launch = 4;
    Status status = 5;
    Config config = 6;
    ConfigSet config_set = 7;
    FileData file = 8;
    FileWritten written = 9;
    DiskUsage disk_usage = 10;
    ModSchema schema = 11;
  }
}

// Start an app the way a tap in the goggles' menu does (core.menu's launch request: the same
// environment and SELinux domain as the UI), with `args` after the entry's own arguments. The
// server answers once the app is ready (it wrote `ready` with its pid into its run dir), when
// `ready_timeout_ms` is over, or at once after the start with `ready_timeout_ms` 0.
message Launch {
  string entry = 1;                 // menu entry id, or mod id (its first app entry): "pcdisplay"
  repeated string args = 2;         // no whitespace inside an argument; at most 12
  bool replace = 3;                 // start even if the app runs (the app decides how to take over)
  uint32 ready_timeout_ms = 4;      // capped at 15000
}

message Launched {
  uint32 pid = 1;
  bool ready = 2;
}

message GetStatus {}

message Status {
  string version = 1;               // the running tinkerglass build
  string session = 2;               // "boot" or "start" (how the session was started)
  bool healthy = 3;                 // the session's health check passed
  repeated App apps = 4;            // the installed app entries (menu entries with a program)
  string tgd = 5;                   // `tgd status`: the full status as tgd's JSON (one line)
}

message App {
  string entry = 1;
  string label = 2;
  uint32 pid = 3;                   // 0: not running
  bool ready = 4;
}

// ---- settings ---------------------------------------------------------------------------------
// The settings of a mod are the `config` of its mod.json, as the installed version's settings
// schema has them. The goggles keep one writer for them (the settings app, this link and
// `tgd config` share it): values are checked against the schema (an unknown choice or a number
// that is not one becomes the default, numbers are kept within their range), merged key by key
// and written atomically.

message Setting {
  string key = 1;
  string value = 2;                 // as stored: bool "1"/"0", int in decimal, enum the option
}

// Every setting of one mod ("" = of every mod with settings), with the defaults filled in.
message GetConfig {
  string mod = 1;
}

message ModConfig {
  string mod = 1;
  repeated Setting values = 2;
}

message Config {
  repeated ModConfig mods = 1;
}

// Change some settings of one mod; the others stay. With `apply`, a change that the mod does
// not pick up by itself (a setting not marked live) reloads the goggles' UI.
message SetConfig {
  string mod = 1;
  repeated Setting values = 2;
  bool apply = 3;
}

message ConfigSet {
  repeated Setting values = 1;      // what was stored (after the checks)
  bool reload_needed = 2;           // a changed setting takes effect only after a UI reload
  bool reloading = 3;               // that reload was requested (`apply`)
}

// What a mod's settings are: enough to show them without its mod.json (eyepiece-pc does).
message GetSchema {
  string mod = 1;
}

message ModSchema {
  string mod = 1;
  string name = 2;                  // the mod's name, as its mod.json has it
  repeated Field fields = 3;
}

message Field {
  string key = 1;
  string type = 2;                  // "bool", "int", "enum" or "string"
  string label = 3;
  string default_value = 4;
  repeated string options = 5;      // enum: the choices
  int32 min = 6;                    // int: the range, the step and a unit ("%")
  int32 max = 7;
  int32 step = 8;
  string unit = 9;
  bool live = 10;                   // the mod applies a change itself (no UI reload)
}

// Reload the goggles' UI with the mods (what a changed setting that is not live needs).
message Reload {}

// ---- files ------------------------------------------------------------------------------------
// Any file the link can read (it runs in the session's domain, dji_services). Writes go anywhere
// except below /system and /vendor (those are changed only by an install), and arrive whole:
// they are written next to the file and renamed when the last piece is in.

message ReadFile {
  string path = 1;                  // absolute
  int64 offset = 2;                 // < 0: from the end ("the last 8 KiB": -8192)
  uint32 length = 3;                // at most 12 KiB per request
}

message FileData {
  bool exists = 1;
  uint64 size = 2;                  // the whole file's
  uint64 offset = 3;                // where `data` starts
  bytes data = 4;
}

message WriteFile {
  string path = 1;                  // absolute; missing directories are made
  uint64 offset = 2;                // 0 starts the file anew; then each piece where the last ended
  bytes data = 3;                   // at most 12 KiB per request
  bool last = 4;                    // this piece completes the file: it replaces `path`
  bool remove = 5;                  // delete `path` instead (data ignored)
}

message FileWritten {
  uint64 size = 1;                  // bytes written so far
}

// The mounted file systems and their space, as `df -k` prints it.
message GetDiskUsage {}

message DiskUsage {
  string df = 1;
}

// ---- events -----------------------------------------------------------------------------------
// After Subscribe the server sends Events for those topics on this interface, between its
// answers, until the next Hello. An event says what changed; the client asks for the new state.

enum Topic {
  TOPIC_UNSPECIFIED = 0;
  TOPIC_STATUS = 1;                 // the session or tgd's status changed (start, health, crash)
  TOPIC_CONFIG = 2;                 // a mod's settings changed (from any client or the goggles)
}

message Subscribe {
  repeated Topic topics = 1;        // replaces the earlier subscription
}

message Event {
  oneof body {
    StatusChanged status = 1;
    ConfigChanged config = 2;
    Closing closing = 3;
  }
}

message StatusChanged {}

message ConfigChanged {
  string mod = 1;
}

// The server stops (the session ends): nothing answers on this interface until the next session.
// Sent to every subscriber.
message Closing {
  string reason = 1;
}
