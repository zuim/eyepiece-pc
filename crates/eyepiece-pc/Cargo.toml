[package]
name = "eyepiece-pc"
description = "PC side of Eyepiece: stream the PC screen to DJI Goggles 3 over USB (library + CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["x11", "pipewire", "tray"]
x11 = ["eyepiece-capture/x11"]
pipewire = ["eyepiece-capture/pipewire"]
# the notification-area / menu-bar icon of a desktop start (Linux: StatusNotifierItem over D-Bus,
# pure Rust, no GTK)
tray = ["dep:tray-icon", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
directories = "6"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
getrandom = "0.3"
subtle = "2"
shlex = "1"
eyepiece-av = { path = "../eyepiece-av" }
eyepiece-capture = { path = "../eyepiece-capture", default-features = false }
eyepiece-link = { path = "../eyepiece-link" }

# the console check, the file dialog and the error box
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false, optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.27", default-features = false, features = ["ksni"], optional = true }

# the tray needs the application event loop on the main thread
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.27", default-features = false, optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"], optional = true }

[[bin]]
name = "eyepiece-pc"
path = "src/bin/eyepiece-pc.rs"
