[package]
name = "eyepiece-capture"
description = "Screen capture backends for Eyepiece: KMS/DRM, X11, PipeWire, Windows DXGI, macOS ScreenCaptureKit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["x11"]
x11 = ["dep:x11rb"]
pipewire = ["dep:pipewire", "dep:ashpd", "dep:pollster"]

[dependencies]
eyepiece-link = { path = "../eyepiece-link" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["shm"], optional = true }
pipewire = { version = "0.9", optional = true, features = ["v0_3_33"] }
ashpd = { version = "0.12", optional = true, default-features = false, features = ["async-std"] }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11.1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
