name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # FFmpeg major the bindings are generated against (dev machine: Debian, FFmpeg 9.0.x)
  FFMPEG_WIN_ZIP: ffmpeg-n9.0-latest-win64-gpl-shared-9.0

jobs:
  linux:
    runs-on: ubuntu-latest
    # Debian testing ships FFmpeg 9 (libavcodec 63) like the dev machine; Ubuntu runners don't.
    # Not pinned to a snapshot: a testing transition can change the FFmpeg major.
    container: debian:testing
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang libclang-dev \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libdrm-dev \
            libpipewire-0.3-dev libspa-0.2-dev
          apt-cache policy libavcodec-dev | head -3
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --locked --all-targets
      - name: Build without PipeWire (feature check)
        run: cargo check --release --locked --no-default-features --features x11 --target-dir target/nopw
      - name: Package
        shell: bash
        run: |
          case "$GITHUB_REF" in refs/tags/*) ver="$GITHUB_REF_NAME" ;; *) ver="${GITHUB_SHA::7}" ;; esac
          name="eyepiece-pc-$ver-linux-x86_64"
          mkdir -p "dist/$name"
          bin=target/release; feat="x11,kms,pipewire"
          cp "$bin/eyepiece-pc" "dist/$name/"
          echo "eyepiece-pc $ver, features: $feat, built on debian:testing ($(dpkg-query -W -f='${Version}' libavcodec-dev))" > "dist/$name/BUILD-INFO.txt"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  # AppImage: built on an older base so it runs on more distributions (glibc 2.39+: Ubuntu
  # 24.04, Debian 13, Fedora 40 and newer); 24.04 is the oldest base whose PipeWire headers
  # the pipewire crate accepts. Its FFmpeg is 6.1 (sonames differ from 9, ~150 dependency
  # libraries), so a minimal FFmpeg 9 is built from source and bundled. KMS capture does not work from an AppImage (no file
  # capabilities): that is what the tar.gz is for.
  appimage:
    runs-on: ubuntu-24.04
    env:
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev nasm libx264-dev libva-dev libdrm-dev file \
            libpipewire-0.3-dev libspa-0.2-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-ubuntu24-${{ hashFiles('packaging/linux/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        run: |
          [ -f "$RUNNER_TEMP/ffmpeg/lib/libavcodec.so" ] || packaging/linux/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          rm -rf "$RUNNER_TEMP/ffmpeg/src"
      - name: Fetch linuxdeploy
        run: |
          curl -sSfL -o "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
      - name: Build AppImage
        shell: bash
        run: |
          case "$GITHUB_REF" in refs/tags/*) ver="$GITHUB_REF_NAME" ;; *) ver="${GITHUB_SHA::7}" ;; esac
          export VERSION="$ver" LINUXDEPLOY="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          export FFMPEG_INCLUDE_DIR="$RUNNER_TEMP/ffmpeg/include" FFMPEG_LIB_DIR="$RUNNER_TEMP/ffmpeg/lib"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/ffmpeg/lib"
          packaging/linux/build-appimage.sh
          mkdir -p dist && mv target/appimage/*.AppImage dist/
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch FFmpeg (BtbN shared build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_WIN_ZIP.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $ff = Join-Path $env:RUNNER_TEMP $env:FFMPEG_WIN_ZIP
          "FFMPEG_DIR=$ff" >> $env:GITHUB_ENV
          "FFMPEG_INCLUDE_DIR=$ff\include" >> $env:GITHUB_ENV
          "FFMPEG_LIB_DIR=$ff\lib" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "$ff\bin" >> $env:GITHUB_PATH
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") { $ver = $env:GITHUB_REF_NAME } else { $ver = $env:GITHUB_SHA.Substring(0, 7) }
          $name = "eyepiece-pc-$ver-windows-x86_64"
          $d = "dist\$name"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target\release\eyepiece-pc.exe, README.md, LICENSE $d
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $d
          Copy-Item "$env:FFMPEG_DIR\LICENSE.txt" "$d\FFMPEG-LICENSE.txt" -ErrorAction SilentlyContinue
          Compress-Archive -Path $d -DestinationPath "dist\$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      # apple-metal uses macOS 26 SDK APIs, even when targeting older macOS versions.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install FFmpeg and bindgen dependencies
        run: brew install ffmpeg pkg-config llvm
      - name: Configure libclang
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked
      - name: Test without screen capture permission
        run: cargo test --release --locked
      - name: Package app and DMG
        shell: bash
        run: |
          case "$GITHUB_REF" in refs/tags/*) ver="$GITHUB_REF_NAME" ;; *) ver="${GITHUB_SHA::7}" ;; esac
          VERSION="$ver" INCLUDE_HOMEBREW_METADATA=1 bash packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, appimage, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zip
            dist/*.dmg
          generate_release_notes: true
